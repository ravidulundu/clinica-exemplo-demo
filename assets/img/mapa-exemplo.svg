<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Mapa ilustrado de exemplo no Rio Vermelho, Salvador</title>
  <desc id="mapDesc">Mapa esquemático, não é um mapa real. O marcador indica um endereço de exemplo.</desc>
  <rect width="1200" height="800" fill="#EFE6D8"/>
  <!-- water / bay suggestion -->
  <path d="M0 520 C 180 500, 260 620, 420 640 C 620 668, 740 580, 900 600 C 1040 616, 1120 700, 1200 690 L 1200 800 L 0 800 Z" fill="#C5D4D6"/>
  <!-- park -->
  <ellipse cx="260" cy="250" rx="120" ry="80" fill="#D5DEC8"/>
  <ellipse cx="980" cy="220" rx="90" ry="60" fill="#D5DEC8"/>
  <!-- blocks -->
  <g fill="#E4D8C6" stroke="#D3C6B3" stroke-width="2">
    <rect x="80" y="80" width="200" height="120" rx="8"/>
    <rect x="320" y="80" width="240" height="140" rx="8"/>
    <rect x="600" y="70" width="180" height="160" rx="8"/>
    <rect x="820" y="80" width="260" height="110" rx="8"/>
    <rect x="80" y="280" width="160" height="150" rx="8"/>
    <rect x="280" y="300" width="220" height="140" rx="8"/>
    <rect x="640" y="300" width="200" height="160" rx="8"/>
    <rect x="880" y="300" width="200" height="130" rx="8"/>
    <rect x="80" y="500" width="200" height="90" rx="8"/>
    <rect x="420" y="520" width="180" height="80" rx="8"/>
    <rect x="820" y="500" width="240" height="100" rx="8"/>
  </g>
  <!-- streets -->
  <g fill="none" stroke="#FAF7F2" stroke-width="18" stroke-linecap="round">
    <path d="M40 230 H 1160"/>
    <path d="M40 460 H 1160"/>
    <path d="M250 40 V 760"/>
    <path d="M540 40 V 620"/>
    <path d="M790 40 V 760"/>
  </g>
  <g fill="#5B6469" font-family="Figtree, system-ui, sans-serif" font-size="18">
    <text x="70" y="224">Rua Exemplo</text>
    <text x="860" y="454">Av. de exemplo</text>
  </g>
  <!-- pin at intersection ~540,230 slightly offset = "Rua Exemplo, 100" -->
  <g transform="translate(540,250)">
    <path d="M0,-72 C22,-72 40,-54 40,-32 C40,-8 0,28 0,28 C0,28 -40,-8 -40,-32 C-40,-54 -22,-72 0,-72 Z" fill="#C8653F"/>
    <circle cy="-40" r="14" fill="#FAF7F2"/>
  </g>
  <g font-family="Figtree, system-ui, sans-serif">
    <rect x="400" y="300" width="320" height="64" rx="8" fill="#1E2A2F"/>
    <text x="560" y="328" text-anchor="middle" fill="#FAF7F2" font-size="20" font-weight="600">Endereço de exemplo</text>
    <text x="560" y="352" text-anchor="middle" fill="#EFE6D8" font-size="16">Rio Vermelho · Salvador – BA</text>
  </g>
</svg>
